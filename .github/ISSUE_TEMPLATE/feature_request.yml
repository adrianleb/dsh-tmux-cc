name: Feature request / 功能建议
description: Suggest an improvement / 提出改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: What workflow or limitation should be improved? / 希望改进什么工作流程或限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其他方案
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
